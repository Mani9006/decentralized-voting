[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decentralized-voting-system"
version = "1.0.0"
description = "A Python-based decentralized voting system with cryptographic signatures, vote chain, ZKP, and consensus validation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Decentralized Voting System Team"}
]
keywords = [
    "voting",
    "blockchain",
    "decentralized",
    "cryptography",
    "election",
    "zero-knowledge-proofs",
    "consensus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
    "pylint>=2.17.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
dvs-cli = "src.cli:main"

[project.urls]
Homepage = "https://github.com/example/decentralized-voting-system"
Documentation = "https://github.com/example/decentralized-voting-system/docs"
Repository = "https://github.com/example/decentralized-voting-system"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"
